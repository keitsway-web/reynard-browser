name: Build TrollStore TIPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14 # macOS Apple Silicon (Sonoma) stable runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.0.app || \
          sudo xcode-select -s /Applications/Xcode_16.1.0.app || \
          sudo xcode-select -s /Applications/Xcode_16.0.0.app || \
          sudo xcode-select -s /Applications/Xcode_16.2.app || \
          sudo xcode-select -s /Applications/Xcode_16.1.app || \
          sudo xcode-select -s /Applications/Xcode_16.0.app || \
          sudo xcode-select -s /Applications/Xcode_16.app || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install dependencies
        run: brew install ldid ccache lld cbindgen

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache Gecko Build Directory
        uses: actions/cache@v4
        with:
          path: engine/firefox/obj-aarch64-apple-ios
          key: ${{ runner.os }}-gecko-obj-${{ hashFiles('engine/release.txt', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-gecko-obj-

      - name: Update and Patch Gecko Engine
        run: |
          zsh tools/development/update-gecko.sh
          zsh tools/development/apply-patches.sh

      - name: Build iDevice Support
        run: |
          zsh tools/development/build-idevice.sh

      - name: Build Gecko Engine
        run: |
          sh tools/development/build-gecko.sh

      - name: Build App
        run: |
          chmod +x tools/release/build-app.sh
          ./tools/release/build-app.sh

      - name: Create TIPA Package
        run: |
          chmod +x tools/release/create-ipa.sh
          ./tools/release/create-ipa.sh

      - name: Upload Reynard-TrollStore.tipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore
          path: dist/Reynard-TrollStore.tipa
          retention-days: 14
